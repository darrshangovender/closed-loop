name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Lint
        run: ruff check .
      # The siblings are not installed here, so the f2-marked tests skip with a clear message.
      - name: Tests
        run: pytest tests/ -q
      # Recomputes the pre-registration and code hashes and compares them with the ledger, and the
      # published documents with results.json.
      - name: Benchmark check
        run: python benchmarks/run.py --check
